<body><main><div class="eyebrow">臺灣火車系列</div><h1>一包一包，拼出 E500</h1><p>沿用已確認的積木車頭，延伸成完整列車。14 包、42 組，逐步加上輪子、車身與車頂。</p><section class="viewer" aria-label="可旋轉的完整積木列車"><div id="scene"><p>正在準備積木列車…</p></div><div class="tools"><button id="reset-view">回到正面</button></div><span class="help">拖曳可轉動 · 雙指或滾輪可縮放</span></section><div class="progress"><label for="progress" id="progress-label">42 / 42 組</label><input id="progress" type="range" min="0" max="42" value="42" aria-label="拼裝進度"><div class="stages"><button data-count="6">輪組</button><button data-count="21">車身</button><button data-count="42">完成</button></div></div><p class="caption">這是實際模型預覽。收藏工作台會把相同部件轉為圖片，讓孩子點擊或拖曳拼上去。<a href="./celebration.html">試玩完工慶祝</a> · <a href="./candidates/index.html">查看拼裝素材</a> · <a href="./prototype.html">查看已確認的車頭小樣</a></p></main><script type="module" src="./render.js"></script></body></html>
