name: publish-wiki

on:
  push:
    branches: [master]   # 改為 repo 的 default branch（發佈目標判定拿到的 defaultBranchRef）
    paths: ['wiki/**']   # 必留：只在 wiki 檔變動時觸發，避免高頻 push 空跑

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update legacy references while preserving Wiki-owned pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Native Camp operational knowledge lives only in .wiki.git.
          test ! -e wiki/Native-Camp-Storage.md || { echo '::error::Edit Native-Camp-Storage in the canonical Wiki.'; exit 1; }
          gh auth setup-git
          publish_dir="$RUNNER_TEMP/aiden-study-wiki"
          git clone --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.wiki.git" "$publish_dir"
          # Overlay the existing repo references; do not delete Wiki-only pages.
          cp -a wiki/. "$publish_dir/"
          git -C "$publish_dir" add --all
          if git -C "$publish_dir" diff --cached --quiet; then exit 0; fi
          git -C "$publish_dir" config user.name github-actions[bot]
          git -C "$publish_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish_dir" commit -m "docs(wiki): sync references from $GITHUB_SHA"
          # One clone and a normal push reject concurrent Wiki edits instead of
          # restoring an older snapshot on top of a newer canonical revision.
          git -C "$publish_dir" push origin HEAD
