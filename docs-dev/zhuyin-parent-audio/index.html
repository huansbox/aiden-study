<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>親錄音檔試聽</title>
<style>
body{max-width:780px;margin:30px auto;padding:0 20px 40px;background:#f1f5f3;color:#203a35;font-family:-apple-system,"PingFang TC",sans-serif;line-height:1.7}h1{font-size:1.6rem}button{font:inherit;border:1px solid #a3b9ac;border-radius:12px;padding:10px 20px;background:white;color:#203a35;cursor:pointer;min-height:46px}#play{background:#216550;color:white}.bar{position:sticky;top:0;background:#f1f5f3;padding:14px 0}#status{min-height:30px}.card{background:white;padding:16px 20px;border:1px solid #dae5de;border-radius:16px;margin:12px 0}.card.active{border-color:#216550}strong{font-size:1.8rem;margin-right:12px}small{color:#526960;overflow-wrap:anywhere}audio{display:block;width:min(100%,360px);margin-top:10px}.note{color:#8b4a0e}
</style>
<h1>14 段親錄音檔已整理好</h1>
<p>使用你錄的 MacBook Pro 版本，縮短前後等待並調整音量。原始錄音與 AirPods 版本都保留。</p>
<div class="bar"><button id="play" disabled>全部試聽</button> <button id="stop">停止</button><div id="status" role="status" aria-live="polite">載入中…</div></div>
<div id="list"></div>
<p>想確認時可集中聽一輪。有哪段聽起來不自然，告訴我是哪個音即可，不需要重新錄整批。</p>
<script>
(async()=>{
 const audio=new Audio(),status=document.querySelector('#status'),cards=new Map();let queue=[],timer,version=0;
 const halt=()=>{version++;clearTimeout(timer);queue=[];audio.pause();document.querySelectorAll('audio').forEach(a=>a.pause());cards.forEach(c=>c.classList.remove('active'));};
 const next=async()=>{cards.forEach(c=>c.classList.remove('active'));const item=queue.shift();if(!item){status.textContent='全部試聽完畢。';return;}const current=version;cards.get(item.key).classList.add('active');status.textContent=`正在播放：${item.glyph}`;audio.src=`../../docs/zhuyin/assets/audio/${item.key}.m4a`;try{await audio.play();}catch{if(current===version){halt();status.textContent='播放失敗，請再按一次試聽。';}}};
 audio.onended=()=>{timer=setTimeout(next,500);};audio.onerror=()=>{halt();status.textContent='音檔讀取失敗，請回對話讓我檢查。';};
 document.querySelector('#stop').onclick=()=>{halt();status.textContent='已停止。';};
 try{
  const response=await fetch('recipe.json');if(!response.ok)throw new Error();const recipe=await response.json();
  for(const item of recipe.items){
   const card=document.createElement('section');card.className='card';const title=document.createElement('strong');title.textContent=item.glyph;const key=document.createElement('small');key.textContent=item.key;
   const clip=document.createElement('audio');clip.controls=true;clip.preload='none';clip.src=`../../docs/zhuyin/assets/audio/${item.key}.m4a`;clip.setAttribute('aria-label',item.glyph+'親錄');
   clip.onplay=()=>{version++;clearTimeout(timer);queue=[];audio.pause();document.querySelectorAll('audio').forEach(a=>{if(a!==clip)a.pause();});cards.forEach(c=>c.classList.remove('active'));card.classList.add('active');status.textContent=`單段試聽：${item.glyph}`;};
   card.append(title,key,clip);
   if(item.reviewNote){const note=document.createElement('p');note.className='note';note.textContent='這段原音有瞬間高峰值；試聽時留意是否有破音。';card.append(note);}
   cards.set(item.key,card);document.querySelector('#list').append(card);
  }
  document.querySelector('#play').disabled=false;document.querySelector('#play').onclick=()=>{halt();queue=[...recipe.items];next();};status.textContent='14 段已備妥，可整批或單段試聽。';
 }catch{status.textContent='讀不到清單，請回對話讓我處理。';}
})();
</script>
</html>
