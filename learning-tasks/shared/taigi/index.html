<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台語朗讀練習</title>
<style><!-- CSS --></style>
<style><!-- SCENE_CSS --></style>
</head>
<body>
<main aria-label="台語朗讀練習">
  <section class="reader" aria-label="朗讀">
    <div id="screen">
      <div id="scene" aria-hidden="true"><!-- SCENE_HTML --></div>
      <canvas id="frame" width="1920" height="1080" role="img" aria-label="朗讀畫面與逐字字幕"></canvas>
    </div>
    <div class="controls">
      <div class="sentence-actions">
        <button id="previous">上一句</button>
        <button id="listen" class="primary">聽這一句</button>
        <button id="next">下一句</button>
      </div>
      <div class="selection">
        <label>段落<select id="paragraph"></select></label>
        <label>練習句<select id="line"></select></label>
      </div>
      <details id="meaning-panel"><summary>看懂這一句</summary>
        <p id="meaning"></p><p id="hint"></p>
      </details>
      <details id="record-panel"><summary>錄一句，比較看看</summary>
        <p>錄好後可以輪流聽學校和自己的聲音。換句或關頁會清除錄音。</p>
        <div class="actions"><button id="record">開始錄音</button><button id="model" hidden>聽學校</button><button id="own" hidden>聽我念</button></div>
        <p id="record-status" role="status"></p>
      </details>
      <div class="actions longer"><button id="whole">播放這一段</button><button id="all">播放全篇</button></div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <audio id="player" preload="auto"></audio><audio id="own-player"></audio>
</main>
<script id="reading" type="application/json"><!-- DATA --></script>
<script id="assets" type="application/json"><!-- ASSETS --></script>
<script><!-- SCENE_JS --></script>
<script><!-- JS --></script>
</body>
</html>
