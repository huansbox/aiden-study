<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阮小妹｜台語朗讀</title>
<style>
  :root {
    font-family: "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    color: #302820;
    background: #f4eee3;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 780px; margin: 0 auto; padding: 28px 16px 48px; }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(2rem, 7vw, 3.3rem); letter-spacing: .025em; line-height: 1.15; }
  h2 { font-size: 1.28rem; line-height: 1.4; }
  header p { margin-top: 6px; color: #70584a; }
  section { margin-top: 20px; }
  .card { background: #fffcf7; border: 1px solid #e4d6c6; border-radius: 20px; overflow: hidden; }
  .panel { padding: clamp(14px, 4vw, 24px); }
  .caption, .original { margin-top: 10px; font-size: clamp(1.24rem, 4vw, 1.65rem); line-height: 1.65; font-weight: 650; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button { font: inherit; font-weight: 650; min-height: 46px; padding: 9px 15px; border-radius: 10px; cursor: pointer; border: 1px solid #b89e84; background: #fff8eb; color: #302820; }
  button.primary { background: #803d28; border-color: #803d28; color: #fff9f0; }
  button:focus-visible { outline: 3px solid #91704a; outline-offset: 3px; }
  .stage { min-height: 150px; background: #ebd8be; }
  #stage:not(.playing) .sister-scene *,
  #stage:not(.playing) .sister-scene *::before,
  #stage:not(.playing) .sister-scene *::after { animation-play-state: paused; }
  .hint, .status, .instruction { color: #70584a; line-height: 1.55; }
  .hint, .instruction { margin-top: 6px; }
  .status { min-height: 1.55em; margin-top: 6px; }
  [hidden] { display: none !important; }
</style>
<!-- SCENES -->
</head>
<body>
<main>
  <header>
    <h1>阮小妹</h1>
    <p>第一段 · 台語朗讀</p>
  </header>
  <section class="card" aria-labelledby="watch-title">
    <div class="stage" id="stage"></div>
    <div class="panel">
      <h2 id="watch-title">先看故事</h2>
      <p class="caption" id="caption"></p>
      <div class="actions">
        <button class="primary" id="film">播放兩幕短片</button>
        <button id="switch-scene">看第二幕</button>
      </div>
      <p class="status" id="film-status" role="status"></p>
    </div>
  </section>
  <section class="card panel" aria-labelledby="read-title">
    <h2 id="read-title">聽完，換你念</h2>
    <p class="original" id="original" aria-live="polite"></p>
    <p class="hint" id="hint" hidden></p>
    <div class="actions">
      <button class="primary" id="listen">聽這一句</button>
      <button id="hint-button" aria-expanded="false" aria-controls="hint">看詞語提示</button>
      <button id="change-line">換下一句</button>
    </div>
    <p class="status" id="read-status" role="status"></p>
  </section>
  <audio id="player" preload="none"></audio>
</main>
<script id="mock-data" type="application/json"><!-- DATA --></script>
<script>
  const byId = (id) => document.getElementById(id);
  const lines = JSON.parse(byId("mock-data").textContent);
  const player = byId("player");
  const stage = byId("stage");
  const film = byId("film");
  const listen = byId("listen");
  const hintButton = byId("hint-button");
  const hint = byId("hint");
  let scene = 0;
  let line = 0;
  let playback = null;

  function showScene(index) {
    scene = index;
    stage.replaceChildren(byId(`scene-${index + 1}`).content.cloneNode(true));
    byId("caption").textContent = lines[index].text;
    byId("switch-scene").textContent = index === 0 ? "看第二幕" : "回第一幕";
  }

  function showLine(index) {
    line = index;
    byId("original").textContent = lines[index].text;
    hint.textContent = lines[index].hint || "";
    hint.hidden = true;
    hintButton.hidden = !hint.textContent;
    hintButton.setAttribute("aria-expanded", "false");
    byId("change-line").textContent = index === 0 ? "換下一句" : "回第一句";
    byId("read-status").textContent = "";
  }

  function stop() {
    player.pause();
    playback = null;
    stage.classList.remove("playing");
    film.textContent = "播放兩幕短片";
    listen.textContent = "聽這一句";
  }

  async function play(kind, clip, nextScene = 0) {
    stop();
    const current = { kind, nextScene };
    playback = current;
    const status = byId(`${kind}-status`);
    status.textContent = "";
    if (kind === "film") {
      showScene(nextScene);
      stage.classList.add("playing");
      film.textContent = "停止短片";
    }
    if (kind === "read") listen.textContent = "停止示範";
    player.src = clip;
    try {
      await player.play();
    } catch {
      if (playback !== current) return;
      stop();
      status.textContent = "音檔播放失敗，請再試一次。";
    }
  }

  player.addEventListener("ended", () => {
    if (!playback) return;
    const { kind, nextScene } = playback;
    if (kind === "film" && nextScene + 1 < lines.length) {
      play("film", lines[nextScene + 1].audio, nextScene + 1);
      return;
    }
    stop();
    if (kind === "film") byId("film-status").textContent = "妹妹是個怎樣的小孩？";
    if (kind === "read") byId("read-status").textContent = "換你念一次。";
  });

  film.addEventListener("click", () => {
    if (playback?.kind === "film") stop();
    else play("film", lines[0].audio);
  });
  listen.addEventListener("click", () => {
    if (playback?.kind === "read") stop();
    else play("read", lines[line].audio);
  });
  byId("switch-scene").addEventListener("click", () => {
    stop();
    byId("film-status").textContent = "";
    showScene(1 - scene);
  });
  byId("change-line").addEventListener("click", () => {
    stop();
    showLine(1 - line);
  });
  hintButton.addEventListener("click", () => {
    hint.hidden = !hint.hidden;
    hintButton.setAttribute("aria-expanded", String(!hint.hidden));
  });

  showScene(0);
  showLine(0);
</script>
</body>
</html>
