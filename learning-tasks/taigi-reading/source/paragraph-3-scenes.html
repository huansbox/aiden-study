<style>
  .paper-scene {
    color: #a55e40;
    background: #f3e3c7;
  }
  .paper-scene::before {
    display: none;
  }
  .paper-scene::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(#7857341c 0.055cqw, transparent 0.09cqw) 0 0 /
      0.78cqw 0.72cqw;
    opacity: 0.55;
  }
  .paper-prop,
  .paper-layer {
    position: absolute;
  }
  .paper-prop {
    overflow: visible;
  }
  .paper-layer {
    inset: 0;
  }
  .paper-muted {
    opacity: 0.48;
  }
  .paper-distant {
    filter: blur(0.18cqw);
    opacity: 0.63;
  }
  .paper-card {
    position: absolute;
    border: 0.6cqw solid #cca77c;
    border-radius: 4cqw;
    background: #fff0d4;
    box-shadow: 0.45cqw 0.65cqw #a0794d35;
  }
  .paper-sit .p2-legs {
    top: 67%;
  }
  .paper-sit .p2-legs::before {
    rotate: 59deg;
  }
  .paper-sit .p2-legs::after {
    rotate: -62deg;
  }
  .paper-pose .p2-body::before {
    rotate: var(--left-arm, 16deg);
  }
  .paper-pose .p2-body::after {
    rotate: var(--right-arm, -16deg);
  }
  .paper-pose .p2-head {
    rotate: var(--head, 0deg);
  }
  .paper-back .p2-head {
    background: var(--h);
  }
  .paper-back .p2-head > *,
  .paper-back .p2-head::after {
    display: none;
  }
  .paper-wide .p2-eyes {
    height: 17%;
  }
  .paper-wide .p2-head::after {
    top: 72%;
    border: 0;
    background: #834433;
    border-radius: 50%;
    height: 15%;
  }
  .paper-cover .p2-body::before,
  .paper-cover .p2-body::after {
    z-index: 3;
    height: 43%;
  }
  .paper-cover .p2-body::before {
    rotate: -156deg;
  }
  .paper-cover .p2-body::after {
    rotate: 156deg;
  }
  .paper-palm {
    left: 98%;
    top: 30%;
    width: 3cqw;
    height: 3.4cqw;
    background: var(--sk);
    border-radius: 45%;
    rotate: -12deg;
  }
  .paper-palm::before {
    content: "";
    bottom: 55%;
    left: 0.35cqw;
    width: 0.55cqw;
    height: 1.7cqw;
    border-radius: 0.35cqw;
    background: inherit;
    box-shadow:
      0.66cqw -0.25cqw var(--sk),
      1.32cqw -0.12cqw var(--sk),
      1.98cqw 0.28cqw var(--sk);
  }
  .paper-heart {
    left: 4.5cqw;
    top: 11cqw;
    width: 3.3cqw;
    height: 3.3cqw;
    z-index: 4;
  }
  .paper-tilt {
    transform-origin: 50% 85%;
  }
  #stage.playing .paper-steam {
    animation: paper-steam 1.7s ease-out infinite;
  }
  #stage.playing .paper-stir {
    animation: paper-stir 0.9s ease-in-out 3 alternate;
    transform-origin: 80% 25%;
  }
  #stage.playing .paper-spin {
    animation: paper-spin 1.45s linear infinite;
  }
  #stage.playing .paper-settle {
    animation: paper-settle 0.95s ease-out both;
  }
  #stage.playing .paper-tilt {
    animation: paper-tilt 0.9s ease-out both;
  }
  #stage.playing .paper-bounce {
    animation: paper-hop 0.78s ease-in-out 4;
  }
  #stage.playing .paper-pulse {
    animation: paper-beat 0.55s ease-in-out 2;
  }
  #stage.playing .paper-call {
    animation: paper-call 1.1s ease-out 3;
  }
  #stage.playing .paper-sigh {
    animation: paper-sigh 1.1s ease-out 1;
  }
  #stage.playing .paper-dash {
    animation: paper-dash 0.75s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  #stage.playing .paper-nod .p2-head {
    animation: paper-nod 1s ease-in-out 2;
  }
  #stage.playing .paper-shake .p2-head {
    animation: paper-shake 0.8s ease-in-out 2;
  }
  #stage.playing .paper-lift .p2-body::after {
    animation: paper-arm 0.75s ease-out both;
  }
  #stage.playing .paper-clap .p2-body::before {
    animation: paper-clap 0.45s ease-in-out 3 alternate;
  }
  #stage.playing .paper-widen .p2-eyes {
    animation: paper-widen 0.6s ease-out;
  }
  @keyframes paper-steam {
    from {
      transform: translateY(0.9cqw);
      opacity: 0.35;
    }
    65% {
      opacity: 1;
    }
    to {
      transform: translateY(-1.6cqw);
      opacity: 0.2;
    }
  }
  @keyframes paper-stir {
    from {
      transform: rotate(-9deg);
    }
    to {
      transform: rotate(12deg);
    }
  }
  @keyframes paper-spin {
    to {
      transform: rotate(360deg);
    }
  }
  @keyframes paper-settle {
    from {
      translate: var(--dx, 0) var(--dy, -2cqw);
      opacity: 0.35;
    }
  }
  @keyframes paper-tilt {
    from {
      rotate: 0deg;
    }
  }
  @keyframes paper-hop {
    50% {
      translate: 0 -2.8cqw;
    }
  }
  @keyframes paper-beat {
    45% {
      scale: 1.26;
    }
  }
  @keyframes paper-call {
    from {
      transform: scale(0.76);
      opacity: 0.5;
    }
    to {
      transform: scale(1.08);
      opacity: 0.95;
    }
  }
  @keyframes paper-sigh {
    50% {
      translate: 0 0.6cqw;
    }
  }
  @keyframes paper-dash {
    from {
      translate: -25cqw 0;
    }
  }
  @keyframes paper-nod {
    50% {
      transform: translateY(4%) rotate(6deg);
    }
  }
  @keyframes paper-shake {
    30% {
      transform: rotate(-5deg);
    }
    70% {
      transform: rotate(5deg);
    }
  }
  @keyframes paper-arm {
    from {
      rotate: -12deg;
    }
  }
  @keyframes paper-clap {
    to {
      rotate: -64deg;
    }
  }
  @keyframes paper-widen {
    from {
      height: 8%;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage .paper-scene *,
    #stage .paper-scene *::before,
    #stage .paper-scene *::after {
      animation: none !important;
    }
  }
</style>
