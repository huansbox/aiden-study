    position: relative;
    display: block;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: #f2e0c2;
    border-radius: 10px;
    isolation: isolate;
  }
  .sister-scene *,
  .sister-scene *::before,
  .sister-scene *::after {
    box-sizing: border-box;
  }
  .p2-scene {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    container-type: inline-size;
    overflow: hidden;
    background: linear-gradient(#fbeed6, #f4d9b0);
    font-family: system-ui, sans-serif;
  }
  .p2-scene::before {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: 9cqw;

    box-shadow: 0 -0.6cqw #d39a60;

  .p2-person {

    width: 12cqw;
    height: 26cqw;
    --c: #b5482e;
    --sk: #f6d0a8;
    --h: #2b1d16;
    scale: var(--s, 1);
    transform-origin: 50% 100%;
    filter: drop-shadow(0.35cqw 0.35cqw #7a3a1a38);
  }
  .p2-little-sister {
    --c: #f5a66b;
  }
  .p2-mother {
    --c: #6f8f5e;
  }
  .p2-father {
    --c: #4f6d8c;
  }
  .p2-mirrored {
    scale: calc(-1 * var(--s, 1)) var(--s, 1);

  .p2-head {
    left: 13%;
    top: 2%;
    width: 74%;
    aspect-ratio: 1;
    border-radius: 50%;

  .p2-head::before {
    content: "";
    left: -3%;
    top: -4%;
    width: 106%;
    height: 44%;
    background: var(--h);
    border-radius: 50% 50% 35% 35%/90% 90% 30% 30%;

  .p2-father .p2-head::before {
    height: 34%;

  .p2-head::after {
    content: "";
    left: 39%;
    top: 68%;
    width: 22%;
    height: 9%;
    border: 0 solid #7a2a1c;
    border-bottom-width: 0.35cqw;
    border-radius: 0 0 50% 50%;

  .p2-angry .p2-head::after,
  .p2-sad .p2-head::after {
    top: 74%;
    border-width: 0.35cqw 0 0;
    border-radius: 50% 50% 0 0;
  }
  .p2-speaking .p2-head::after {
    background: #7a2a1c;
    border-radius: 50%;
  }
  .p2-little-sister::before,
  .p2-mother::before,
  .p2-older-sister::before {
    content: "";
    background: var(--h);
    z-index: 1;
    border-radius: 50%;
    top: -6%;
    left: 36%;
    width: 28%;
    aspect-ratio: 1;
  }
  .p2-little-sister::before {
    top: -3%;
    left: 6%;

  .p2-older-sister::before {
    top: 24%;
    left: 80%;
    width: 17%;
    height: 22%;
    aspect-ratio: auto;
  }
  .p2-brows {
    left: 20%;
    top: 43%;
    width: 60%;
    height: 5%;
  }
  .p2-eyes {
    left: 24%;
    top: 52%;
    width: 52%;
    height: 12%;
  }
  .p2-brows::before,
  .p2-brows::after,
  .p2-eyes::before,
  .p2-eyes::after {
    content: "";
    width: 30%;
    height: 100%;
    background: var(--h);
    border-radius: 1cqw;
  }
  .p2-brows::after,
  .p2-eyes::after {
    right: 0;
  }
  .p2-eyes::before,
  .p2-eyes::after {
    width: 18%;
    border-radius: 50%;
  }
  .p2-angry .p2-brows::before {
    rotate: 20deg;
  }
  .p2-angry .p2-brows::after {
    rotate: -20deg;
  }
  .p2-sad .p2-brows::before {
    rotate: -16deg;
  }
  .p2-sad .p2-brows::after {
    rotate: 16deg;
  }
  .p2-gentle .p2-eyes::before,
  .p2-gentle .p2-eyes::after {
    background: none;
    height: 70%;
    border-top: 0.35cqw solid var(--h);
  }
  .p2-right .p2-eyes {
    left: 30%;
  }
  .p2-left .p2-eyes {
    left: 17%;
  }
  .p2-body {
    left: 24%;
    top: 34%;
    width: 52%;
    height: 40%;
    background: var(--c);
    border-radius: 40% 40% 12% 12%/25% 25% 8% 8%;
  }
  .p2-body::before,
  .p2-body::after {
    content: "";
    top: 6%;
    left: -14%;
    width: 25%;
    height: 55%;
    background: var(--c);
    border-bottom: 2cqw solid var(--sk);
    border-radius: 1.2cqw;
    transform-origin: 50% 8%;
    rotate: 16deg;
  }
  .p2-body::after {
    left: auto;
    right: -14%;
    rotate: -16deg;
  }
  .p2-legs {
    left: 31%;
    top: 72%;
    width: 38%;
    height: 24%;
  }
  .p2-legs::before,
  .p2-legs::after {
    content: "";
    left: 6%;
    width: 32%;
    height: 100%;
    box-sizing: border-box;
    background: #5a3a2c;
    border-bottom: 0.9cqw solid #3a2418;
    border-radius: 0.6cqw;
    transform-origin: 50% 0;
  }
  .p2-legs::after {
    left: auto;
    right: 6%;
  }
  .p2-hands-on-hips .p2-body::before {
    rotate: 50deg;
    height: 30%;
  }
  .p2-hands-on-hips .p2-body::after {
    rotate: -50deg;
    height: 30%;
  }
  .p2-hunched .p2-head {
    translate: 0 7%;
  }

    rotate: 4deg;
  }
  .p2-hunched .p2-body::after {
    rotate: -4deg;
  }
  .p2-running {
    rotate: -8deg;
  }
  .p2-running .p2-legs::before {
    rotate: 32deg;
  }
  .p2-running .p2-legs::after {
    rotate: -28deg;
  }
  .p2-running .p2-body::before {
    rotate: -55deg;
  }
  .p2-running .p2-body::after {
    rotate: 40deg;
  }
  .p2-talking .p2-body::after {
    rotate: -140deg;
  }
  .p2-looking-up .p2-head {
    rotate: -8deg;
  }
  .p2-silhouette {
    filter: brightness(0) opacity(0.35);
  }
  .p2-sweat {
    left: -12%;
    top: 8%;
    width: 3cqw;
    height: 3cqw;
    background: #8fc6e8;
    border-radius: 0 50% 50%;
    rotate: 45deg;
    z-index: 3;
  }

  .p1-scene::before {
    display: none;
  }
  .p1-home {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

    top: 70%;
    width: 48%;
    left: 26%;
    height: 20%;
  }

    rotate: 0deg;
    width: 49%;

      72% 100%,
      29% 100%,
      51% 43%,
      0 23%
    );
  }
  .p1-seated .p2-legs::before {
    scale: -1 1;
  }
  .p1-elder {
    --c: #927d97;
    --h: #665956;
  }
  .p1-glasses {
    left: 14%;
    top: 46%;
    width: 29%;
    height: 25%;
    border: 0.28cqw solid #63534a;
    border-radius: 40%;
    z-index: 3;
  }
  .p1-glasses::after {
    content: "";
    left: 154%;
    top: -0.28cqw;
    width: 100%;
    height: 100%;
    box-sizing: content-box;
    border: 0.28cqw solid #63534a;
    border-radius: 40%;
  }
  .p1-block {
    bottom: 5cqw;
    left: var(--x);
    width: 4cqw;
    height: 4cqw;
    border-radius: 0.45cqw;
    rotate: var(--angle, 0deg);
    background: var(--tone);
    box-shadow:
      inset -0.45cqw -0.35cqw #72533042,
      0 0.24cqw #865a4636;
  }
  .p1-portraits {
    background: linear-gradient(110deg, #f6e4c7, #e7cdb2);
  }
  .p1-portrait {
    position: absolute;
    left: 5%;
    top: 9%;
    width: 41%;
    height: 83%;
    overflow: hidden;
    border-radius: 4cqw;
    background: #f6e5b9;
    border: 0.5cqw solid #fff1da;
    box-shadow: 0 0.55cqw #bd98654a;
  }
  .p1-portrait::before {
    content: "";
    inset: 8% 5%;
    border-radius: 50%;
    background: #fbefd4;
  }
  .p1-fierce {
    left: 54%;
    background: #e3b8a2;
  }
  .p1-fierce::before {
    background: #f0d2bf;
  }
  .p1-portrait .p2-person {
    left: calc(50% - 6cqw);
    bottom: -15cqw;
    --s: 2.1;
  }
  .p1-portraits[data-focus] .p1-fierce {
    display: none;
  }
  .p1-portraits:is([data-focus="eyes"], [data-focus="portrait"]) .p1-portrait {
    left: 24%;
    width: 52%;
  }
  .p1-portraits[data-focus="eyes"] .p2-person {
    --s: 3.7;
    bottom: -54cqw;
  }
  .p1-portraits[data-focus="eyes"] .p2-eyes {
    height: 16%;
  }
  .p1-portraits[data-focus="portrait"] .p2-head::after {
    width: 31%;
    left: 34.5%;
    height: 13%;
  }
  #stage.playing .p1-hop {
    animation: p1-hop 0.9s ease-in-out 3;
  }
  #stage.playing .p1-block:last-child {
    animation: p1-hop 0.72s ease-in-out 3;
  }
  #stage.playing .p1-portrait .p2-head {
    animation: p1-tilt 1.2s ease-in-out 2 alternate;
  }
  @keyframes p1-hop {
    50% {
      translate: 0 -1.5cqw;
    }
  }
  @keyframes p1-tilt {
    65% {
      rotate: 3deg;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sister-scene *,
    .sister-scene *::before,
    .sister-scene *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
