<style>
  .paper-night {
    background: #e5cda7;
  }
  .paper-night .paper-camera {
    position: absolute;
    inset: 0;
    transform: scale(var(--zoom, 1));
    transform-origin: var(--origin, 50% 55%);
  }
  .paper-night .paper-camera :is(.p2-older-sister, .p2-little-sister) .p2-legs {
    display: none;
  }
  .paper-night .paper-pat .p2-body::after {
    height: 78%;
    z-index: 3;
  }
  .paper-night .paper-calendar {
    perspective: 50cqw;
  }
  .paper-night .paper-page {
    position: absolute;
    top: 17%;
    left: 2%;
    width: 96%;
    height: 80%;
    background-color: #f7ebc8;
    border-radius: 0 0 0.4cqw 0.4cqw;
    transform-origin: 50% 0;
    backface-visibility: hidden;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 13%, #d4b58b 13% 14%),
      repeating-linear-gradient(transparent 0 24%, #d4b58b 24% 26%);
  }
  .paper-night .paper-page:nth-child(2) {
    background-color: #efd7a9;
  }
  .paper-night .paper-page:nth-child(3) {
    background-color: #fff0ce;
  }
  .paper-night .paper-grown {
    filter: brightness(0) saturate(0);
    opacity: 0.48;
    transform-origin: 50% 100%;
  }
  #stage.playing .paper-night .paper-pat .p2-body::after {
    animation: paper-pat 1.1s ease-in-out 2;
  }
  #stage.playing .paper-night .paper-reply .p2-head::after {
    animation: paper-reply 0.4s ease-in-out 3 alternate;
  }
  #stage.playing .paper-night .paper-tuck {
    animation: paper-tuck 1.2s ease-in-out both;
  }
  #stage.playing .paper-night .paper-grown {
    animation: paper-grow 3s ease-in-out both;
  }
  #stage.playing .paper-night .paper-page {
    animation: paper-leaf 0.49s var(--delay, 0s) ease-in forwards;
  }
  #stage.playing .paper-night .paper-join {
    animation: paper-join 1.3s ease-in-out both;
  }
  #stage.playing .paper-night .paper-glow {
    animation: paper-lamplight 2.7s ease-out both;
  }
  @keyframes paper-pat {
    50% {
      transform: rotate(-9deg);
    }
  }
  @keyframes paper-reply {
    50% {
      height: 15%;
    }
  }
  @keyframes paper-tuck {
    from {
      transform: translate(-1.15cqw, 1.1cqw) rotate(-2deg);
    }
  }
  @keyframes paper-grow {
    from {
      transform: scale(0.73);
    }
  }
  @keyframes paper-leaf {
    to {
      transform: rotateX(130deg);
      opacity: 0;
    }
  }
  @keyframes paper-join {
    from {
      transform: translateX(var(--from, 1.9cqw));
    }
  }
  @keyframes paper-lamplight {
    from {
      opacity: 0.38;
      scale: 1.1;
    }
  }
</style>
