  #stage.playing .paper-cry .paper-tear {

  @keyframes paper-teardrop {

    to {

      opacity: 0.25;
    }
  }
  @keyframes paper-kick {

  @keyframes paper-swim {

      translate: 2cqw -0.35cqw;
    }
  }
  @keyframes paper-laugh {
    50% {
      translate: 0 -0.65cqw;
    }

  @keyframes paper-remember {
    from {
      opacity: 0.15;
      scale: 0.95;
    }

  @keyframes paper-memory-away {
    0%,
