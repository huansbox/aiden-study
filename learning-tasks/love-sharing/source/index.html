<body>
<header><a href="../index.html">回學習首頁</a><span>閱讀小工坊</span></header>
<main>
  <h1>愛的分享 · 我的心智圖</h1>
  <p id="font-status" class="muted" role="status">注音字型載入中。</p>
  <div class="workspace">
    <section id="guide" class="card" aria-label="選擇重點"></section>
    <section class="card map-card" aria-label="我的心智圖">
      <h2 id="map-title">五條主枝，一步一步拼</h2>
      <div id="map" class="mind-map"></div>
      <p id="save-status" class="muted" role="status"></p>
    </section>
  </div>
  <section id="finish" class="card" hidden></section>
  <details class="parent-note"><summary>給陪讀的大人</summary>
    <p>先請孩子說說文章裡發生什麼事，再選自己看得懂的短詞。每一步選一組，各選項都有文章依據，不計分。想不起來時，可以打開「回頭讀一小段」。</p>
    <p>五條主枝保留奶奶的改變、嘟嘟的訓練、服務的對象、陪伴與復健的幫助，以及每週分享愛的行動。完成後可讓孩子說說：嘟嘟的愛，怎麼從奶奶傳到其他人身上？</p>
    <p>先寫中間的原題，再往外畫五條線。圖上的每個短詞就是要抄的內容。進度只記在此瀏覽器，與上次作業分開。</p>
  </details>
</main>
