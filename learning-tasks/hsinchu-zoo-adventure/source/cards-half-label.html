<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新竹動物園小小探險｜A4 二分標籤</title>
  <style>
    @page { size: A4 landscape; margin: 0; }

    :root {
      --ink: #171717;
      --mid: #686868;
      --pale: #efefec;
      --paper: #fff;
      --font: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #cfcfcf;
      color: var(--ink);
      font-family: var(--font);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .screen-note {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px 18px;
      border-bottom: 2px solid var(--ink);
      background: var(--paper);
      font-size: 14px;
      font-weight: 800;
    }

    .page {
      width: 297mm;
      height: 210mm;
      display: grid;
      grid-template-columns: repeat(2, 148.5mm);
      margin: 10mm auto;
      overflow: hidden;
      background: var(--paper);
      break-after: page;
      page-break-after: always;
    }

    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }

    .label-cell {
      width: 148.5mm;
      height: 210mm;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .label-cell:first-child { border-right: 0.25mm dashed #aaa; }

    .card {
      position: relative;
      width: 117mm;
      height: 170mm;
      display: grid;
      grid-template-rows: 12mm 19mm 82mm 27mm 16.5mm;
      gap: 1.5mm;
      padding: 3mm;
      overflow: hidden;
      border: 0.7mm solid var(--ink);
      border-radius: 4mm;
      background: var(--paper);
    }

    .card::after {
      content: "2026-8-14";
      position: absolute;
      right: 4.5mm;
      bottom: 1.1mm;
      padding-left: 1.2mm;
      background: var(--paper);
      color: #666;
      font-size: 8pt;
      font-weight: 800;
      letter-spacing: 0.035em;
    }

    .card.map-card { grid-template-rows: 13mm 108mm 25mm 12mm; }

    .card.train-map-card { grid-template-rows: 13mm 108mm 25mm 12mm; }

    .card.reflection-card {
      grid-template-rows: 9mm 12mm 32mm 105mm;
      gap: 1.2mm;
    }

    .reflection-card .station {
      padding-bottom: 0.8mm;
      font-size: 8.5pt;
    }

    .reflection-card .station .badge {
      padding: 0.55mm 1.8mm;
      font-size: 6.8pt;
    }

    .reflection-card .question {
      font-size: 13pt;
      line-height: 1.15;
    }

    .card.meerkat-card {
      grid-template-rows: 12mm 15mm 25mm 65mm 23mm 16.5mm;
      gap: 1.2mm;
    }

    .station {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5mm 1.2mm;
      border-bottom: 0.45mm solid var(--ink);
      font-size: 10.5pt;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .station .badge {
      padding: 0.8mm 2.3mm;
      border: 0.45mm solid var(--ink);
      border-radius: 99mm;
      font-size: 8pt;
      letter-spacing: 0.03em;
    }

    .question {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2mm;
      text-align: center;
      font-size: 17.5pt;
      font-weight: 950;
      line-height: 1.2;
    }

    .meerkat-card .question { font-size: 15pt; }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2mm;
    }

    .choice {
      min-width: 0;
      display: grid;
      grid-template-rows: 9.5mm 1fr;
      overflow: hidden;
      border: 0.55mm solid var(--ink);
      border-radius: 3mm;
      background: var(--paper);
    }

    .choice-number {
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 0.4mm solid var(--ink);
      background: var(--pale);
      font-size: 16pt;
      font-weight: 950;
    }

    .choice-art {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 0.6mm;
      overflow: hidden;
      background: var(--paper);
    }

    .choice-art img,
    .reference-strip img,
    .map-wrap svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .choice-art img,
    .reference-strip img {
      object-fit: contain;
      object-position: center;
    }

    .reference-strip {
      display: grid;
      grid-template-columns: 22mm 1fr;
      align-items: center;
      gap: 2mm;
      padding: 1.2mm 3mm;
      overflow: hidden;
      border: 0.5mm solid var(--ink);
      border-radius: 2.5mm;
      background: #f7f7f3;
    }

    .reference-strip img {
      min-width: 0;
      object-fit: cover;
      object-position: 58% 58%;
    }

    .reference-strip span {
      font-size: 11.5pt;
      font-weight: 900;
      line-height: 1.25;
    }

    .success {
      display: flex;
      align-items: center;
      gap: 2.5mm;
      padding: 2.2mm 3mm;
      border: 0.5mm solid var(--ink);
      border-radius: 2.5mm;
      background: var(--pale);
      font-size: 10.8pt;
      font-weight: 800;
      line-height: 1.3;
    }

    .success-mark {
      flex: 0 0 8mm;
      width: 8mm;
      height: 8mm;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0.55mm solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      font-size: 13pt;
      font-weight: 950;
    }

    .parent-whisper {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2mm 3mm;
      transform: rotate(180deg);
      border-top: 0.35mm dashed var(--mid);
      color: #3d3d3d;
      text-align: center;
      font-size: 7.4pt;
      font-weight: 700;
      line-height: 1.23;
    }

    .map-wrap {
      padding: 1mm;
      overflow: hidden;
      border: 0.55mm solid var(--ink);
      border-radius: 3mm;
      background: #f7f7f3;
    }

    .train-map-card .map-wrap {
      padding: 0;
      background: #e7e7e2;
    }

    .reflection-choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2mm;
    }

    .reflection-choice {
      min-width: 0;
      display: grid;
      grid-template-rows: 6.5mm 1fr 7mm;
      overflow: hidden;
      border: 0.55mm solid var(--ink);
      border-radius: 3mm;
      background: var(--paper);
    }

    .reflection-choice .choice-number { font-size: 11pt; }

    .reflection-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.3mm 3.6mm;
      overflow: hidden;
    }

    .reflection-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .reflection-label {
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 0.35mm solid #aaa;
      background: #f7f7f3;
      font-size: 6.8pt;
      font-weight: 900;
      text-align: center;
    }

    .memory-box {
      position: relative;
      overflow: hidden;
      border: 0.55mm solid var(--ink);
      border-radius: 3mm;
      background: #fff;
    }

    .memory-box-label {
      position: absolute;
      top: 2.5mm;
      left: 3mm;
      color: var(--mid);
      font-size: 8pt;
      font-weight: 850;
    }

    .memory-box svg {
      position: absolute;
      right: 3mm;
      bottom: 2mm;
      width: 19mm;
      height: 13mm;
      opacity: 0.25;
    }

    .map-note {
      display: flex;
      align-items: center;
      padding: 2.2mm 3mm;
      border: 0.5mm solid var(--ink);
      border-radius: 2.5mm;
      background: var(--pale);
      font-size: 10.5pt;
      font-weight: 850;
      line-height: 1.35;
    }

    svg .line {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    svg .thin { stroke-width: 4; }
    svg .thick { stroke-width: 12; }
    svg .fill-dark { fill: var(--ink); }
    svg .fill-white { fill: #fff; }
    svg text { font-family: var(--font); fill: var(--ink); }
    svg text.light-text { fill: #fff; }

    @media print {
      body { background: var(--paper); }
      .screen-note { display: none; }
      .page { margin: 0; }
    }
  </style>
</head>
<body>
  <div class="screen-note">A4 橫式二分標籤｜卡面 117 × 170 mm｜列印縮放 100%｜每頁 2 張</div>
  <main id="pages"></main>

      </div>
      <div class="map-note">不用把每個圈走完。只要你自己選過一次方向，就是今天的地圖小隊長。</div>

    </article>

  <template id="tiger-card">
    <article class="card">
      <header class="station"><span>老虎花紋偵探</span><span class="badge">睏寶</span></header>
      <div class="question">哪一塊身體花紋，和睏寶最像？</div>
      <div class="choices">
        <div class="choice"><div class="choice-number">1</div><div class="choice-art"><img src="../assets/images/v2-crops/tiger-1.webp" alt="彎曲、分岔且不規則的虎紋"></div></div>
        <div class="choice"><div class="choice-number">2</div><div class="choice-art"><img src="../assets/images/v2-crops/tiger-2.webp" alt="規則、平行且不分岔的條紋"></div></div>
        <div class="choice"><div class="choice-number">3</div><div class="choice-art"><img src="../assets/images/v2-crops/tiger-3.webp" alt="多段短而斷裂的條紋"></div></div>
      </div>
      <div class="success"><span class="success-mark">✓</span><span>沿著現場一條紋路比方向；說出「有沒有彎或分岔」就成功。</span></div>

  <script>
    const cardIds = [
      "map-card",
      "tiger-card",
      "hippo-card",
      "arms-card",
      "coati-card",
      "shell-card",
      "meerkat-card",
      "insect-card",
      "train-map-card",
      "reflection-card",
    ];

    const pages = document.querySelector("#pages");
    for (let index = 0; index < cardIds.length; index += 2) {
      const page = document.createElement("section");
      page.className = "page";
      for (const cardId of cardIds.slice(index, index + 2)) {
        const cell = document.createElement("div");
        cell.className = "label-cell";
        cell.append(document.querySelector(`#${cardId}`).content.cloneNode(true));
        page.append(cell);
      }
      pages.append(page);
    }
  </script>
