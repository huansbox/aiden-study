<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'">
  <title>火車試拼 · 家長後台</title>
  <link rel="stylesheet" href="../shared/brick-workshop.css?v=20260923-parent-preview">
  <link rel="stylesheet" href="../shared/brick-celebration.css?v=20260923-train-series">
  <link rel="stylesheet" href="train-preview.css?v=20260923-parent-preview">
</head>
<body>
  <main class="train-preview">
    <header class="train-preview__header">
      <div><p class="train-preview__eyebrow">家長試玩</p><h1>火車試拼</h1></div>
      <a id="back-parent" href="./?child=aiden">回家長後台</a>
    </header>
    <section class="train-preview__controls" aria-label="試拼設定">
      <p>自由試拼，不消耗拼裝包，也不影響任何孩子的收藏。</p>
      <div class="train-preview__actions">
        <label for="train-model">選擇火車 <select id="train-model"></select></label>
        <button type="button" id="start-first">從第一包開始</button>
        <button type="button" id="start-last">試最後一片與慶祝</button>
      </div>
      <p id="preview-mode" role="status"></p>
      <p class="train-preview__note">試拼進度只留在此頁；切換火車、重新開始或重新整理都會重置。</p>
    </section>
    <div id="train-workshop"></div>
    <noscript>請開啟 JavaScript，才能試拼火車。</noscript>
  </main>
  <script src="../shared/brick-e500.js?v=20260923-train-series"></script>
  <script src="../shared/brick-emu3000.js?v=20260923-train-series"></script>
  <script src="../shared/brick-r200.js?v=20260923-train-series"></script>
  <script src="../shared/brick-700t.js?v=20260926-high-speed-trains"></script>
  <script src="../shared/brick-n700s.js?v=20260926-high-speed-trains"></script>
  <script src="../shared/brick-models.js?v=20260926-high-speed-trains"></script>
  <script src="../shared/brick-celebration.js?v=20260926-high-speed-trains"></script>
  <script src="../shared/brick-audio.js?v=20260923-train-series"></script>
  <script src="../shared/brick-workshop.js?v=20260926-high-speed-trains"></script>
  <script src="train-preview.js?v=20260923-parent-preview"></script>
  <script>KidsTrainPreview.boot();</script>
</body>
</html>
