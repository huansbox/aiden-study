<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'">
  <title>E500 造車工坊 · 原型比較</title>
  <link rel="stylesheet" href="../shared/brick-workshop.css">
  <link rel="stylesheet" href="../shared/brick-celebration.css">
  <link rel="stylesheet" href="e500-lab.css">
  <script defer src="../shared/brick-e500.js"></script>
  <script defer src="../shared/brick-audio.js"></script>
  <script defer src="../shared/brick-celebration.js"></script>
  <script defer src="../shared/brick-workshop.js"></script>
  <script defer src="e500-lab-state.js"></script>
  <script defer src="e500-lab.js"></script>
</head>
<body>
  <main class="lab">
    <header class="lab-heading">
      <h1>E500 造車工坊</h1>
      <span class="prototype-badge">原型比較 · 家長試玩</span>
    </header>
    <section class="comparison" aria-label="比較設定">
      <div class="comparison-row">
        <div class="segmented" aria-label="比較版本">
          <button type="button" data-mode="improved" aria-pressed="true">改善版</button>
          <button type="button" data-mode="current" aria-pressed="false">現況版</button>
        </div>
        <div class="stage-choices" aria-label="比較起點">
          <button type="button" data-preset="chassis" aria-pressed="false">01 底盤</button>
          <button type="button" data-preset="half" aria-pressed="true">02 半完成</button>
          <button type="button" data-preset="finish" aria-pressed="false">03 接近完工</button>
        </div>
        <button type="button" class="text-button" id="reset-trials">兩版重試這一包</button>
      </div>
      <p id="comparison-note" class="sr-only">同一個起點，各試三組零件。切換版本會保留各自的操作進度。</p>
    </section>
    <div id="improved-host"></div>
    <div id="current-host" hidden></div>
    <p id="lab-announcement" class="sr-only" role="status" aria-live="polite"></p>
    <footer class="lab-footer">
      <details><summary>家長說明</summary><p>兩版從相同起點各試三組，切換保留各自進度，重試一起回到起點。自由試玩，不消耗拼裝包，也不影響孩子收藏；重新整理會重置。試推：按「試推」，再用滑鼠或手指按住模型左右移動，也能用箭頭按鈕或滑桿。看得出已造好哪裡、還缺什麼嗎？接合時像自己裝上的嗎？先比較手感，再跨幾次觀察新鮮感。</p></details>
    </footer>
    <noscript>請開啟 JavaScript，才能試拼火車。</noscript>
  </main>
</body>
</html>
