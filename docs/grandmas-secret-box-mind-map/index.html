<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#f7f5ee">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>奶奶的祕密盒子 · 拼出閱讀心智圖</title>
</head>
<body>
<header><a href="../index.html">回學習首頁</a></header>
<main>
  <h1>奶奶的祕密盒子</h1>
  <p id="font-status" class="muted" role="status">注音字型載入中。</p>
  <div class="workspace">
    <section id="guide" class="card" aria-label="選擇重點"></section>
    <section class="card map-card" aria-label="我的心智圖">
      <h2 id="map-title">我的心智圖</h2>
      <div id="map" class="mind-map">
        <svg class="map-lines" aria-hidden="true"></svg>
        <div class="center-node"><span>奶奶的</span><span>祕密盒子</span></div>
      </div>
      <p id="save-status" class="muted" role="status"></p>
    </section>
  </div>
  <section id="finish" class="card" hidden>
    <p>先寫中央的題目，再從右上方的第 1 枝順時針寫下去。想改哪一枝，就點它的標題。</p>
    <div class="actions"><button id="revise" type="button">回去改一改</button><button id="print" type="button">列印</button></div>
  </section>
  <details class="parent-note"><summary>給陪讀的大人</summary>
    <p>先請孩子把答案說一次，再決定怎麼寫。如果孩子只說「他幫忙」，可以追問「他是誰？做了什麼？後來怎麼了？」</p>
    <p>看完第 4 枝和第 5 枝，可以問孩子從相片看見什麼，以及家人知道奶奶想念誰之後做了什麼。</p>
  </details>
</main>
<script src="../mind-map-reading.js"></script>

</body>
</html>
